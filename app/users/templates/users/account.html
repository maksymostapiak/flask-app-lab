{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Привіт, {{ user.username }}!</h2>
    <p>Ви вдало зайшли у акаунт.</p>

    <div class="alert alert-info">
        <strong>Email:</strong> {{ user.email }}
    </div>

    <a href="{{ url_for('users.logout') }}" class="btn btn-danger">Вийти</a>
</div>
{% endblock %}
