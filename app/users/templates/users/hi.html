{% extends 'base.html' %}

{% block title %}Greeting Page{% endblock %}

{% block content %}

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('users.greetings', name='John', age=30) }}">Greet John</a>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('users.admin') }}">Admin</a>
      </ul>
  </div>
</nav>

<div class="container mt-4">
<h2 class="mb-3">Hello, {{ name }}!</h2>
{% if age %}
  <p class="lead">You are {{ age }} years old.</p>
{% else %}
  <p class="lead">Age is unknown.</p>
  </div>
{% endif %}
{% endblock %}
