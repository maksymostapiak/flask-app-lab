{% extends "base.html" %}
{% block content %}
<div class="container mt-4">

    <h2 class="mb-3">Список користувачів ({{ total }})</h2>

    {% if users %}
    <table class="table table-bordered table-hover">
        <thead class="table-warning">
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody>
            {% for u in users %}
            <tr>
                <td>{{ u.id }}</td>
                <td>{{ u.username }}</td>
                <td>{{ u.email }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    {% else %}
    <div class="alert alert-info">
        Немає зареєстрованих користувачів.
    </div>
    {% endif %}

</div>
{% endblock %}
