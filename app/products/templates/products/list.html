{% extends 'base.html' %}

{% block title %}Products{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow-sm border-dark bg-light">
        <div class="card-header bg-dark text-white text-center">
            <h2 class="mb-0">Product List</h2>
        </div>
        <div class="card-body bg-white">
            {% if products %}
                <ul class="list-group">
                    {% for product in products %}
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <span class="fw-semibold text-dark">{{ product.name }}</span>
                            <span class="badge bg-dark text-white">${{ product.price }}</span>
                        </li>
                    {% endfor %}
                </ul>
            {% else %}
                <p class="text-center text-muted mt-3">No products available.</p>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
